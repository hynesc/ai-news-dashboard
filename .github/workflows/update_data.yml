name: Update News Data

on:
  schedule:
  # Runs the script every day at 2 am.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pin the image so runner upgrades cannot silently change Python availability.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.12-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news pipeline
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python news_pipeline.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add news_data.csv
          git diff --staged --quiet || git commit -m "Update news data" && git push
